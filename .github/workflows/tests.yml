name: tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        shell: bash
        env:
          # Production defaults intentionally pin Coder to a Windows workspace.
          # Use an isolated POSIX workspace in Linux CI instead of weakening
          # the runtime's host-platform guard.
          CODER_WORKSPACE: ${{ runner.temp }}/study-agent-coder-workspace
        run: |
          set -o pipefail
          python -m pytest -q --tb=short -ra --ignore=tests/test_coder_security.py --junitxml=pytest-results.xml 2>&1 | tee pytest.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics-${{ matrix.python-version }}
          path: |
            pytest.log
            pytest-results.xml
          if-no-files-found: ignore
          retention-days: 7


  coder-sandbox-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build Coder sandbox image
        run: docker build --pull=false -t study-agent-coder-python:1 coder

      - name: Run Coder security tests
        shell: bash
        run: |
          python -m pytest -q tests/test_coder_security.py --tb=short -ra

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>StudyAgent</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.12.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@18.1.0/lib/marked.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.12.0/lib/common.min.js"></script>
<script>window.MathJax={tex:{inlineMath:[["$","$"],["\\(","\\)"]],displayMath:[["$$","$$"],["\\[","\\]"]]},svg:{fontCache:"global"}};</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-svg.js"></script>
<style>
:root{color-scheme:dark;--bg:#0f1115;--panel:#151821;--panel2:#1b1f28;--panel3:#232936;--border:#2b313c;--text:#e9ecf1;--muted:#929aaa;--muted2:#697282;--accent:#e7e9ee;--accentText:#111318;--user:#252c38;--danger:#e47074;--ok:#86c98a;--shadow:0 18px 70px rgba(0,0,0,.34)}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}
.shell{height:100%;display:flex;overflow:hidden}.sidebar{width:280px;min-width:280px;display:flex;flex-direction:column;padding:18px 14px;background:#11141a;border-right:1px solid var(--border)}.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 18px}.mark{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:var(--accent);color:#111;font-weight:800}.brand strong{display:block}.brand small{display:block;color:var(--muted);font-size:11px}
button{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:11px}.new{padding:10px 12px;text-align:left}.new:hover,.secondary:hover,.icon:hover{background:var(--panel3)}.side-title{margin:22px 8px 8px;color:var(--muted2);font-size:11px;font-weight:700;letter-spacing:.08em}.list{overflow:auto}.conv{display:flex;gap:4px;margin:3px 0}.conv-open{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:9px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.conv.active .conv-open{background:#202630}.conv-open:hover{background:#191d25}.conv-del{width:30px;border:0;background:transparent;color:var(--muted2);opacity:0}.conv:hover .conv-del,.conv.active .conv-del{opacity:1}.conv-del:hover{background:#2d2022;color:var(--danger)}.side-bottom{margin-top:auto;display:grid;gap:10px}.secondary{width:100%;padding:9px 12px}.backend{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--border);border-radius:12px;background:#14171d}.dot{width:8px;height:8px;flex:none;border-radius:50%;background:#6f7785}.dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(134,201,138,.12)}.dot.err{background:var(--danger)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:62px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border);background:rgba(15,17,21,.88);backdrop-filter:blur(12px)}.info strong{display:block}.info span{display:block;color:var(--muted);font-size:11px}.icon{width:36px;height:36px;display:grid;place-items:center}.mobile{display:none}
.chat{flex:1;min-height:0;overflow:auto;scroll-behavior:smooth}.welcome{width:min(760px,calc(100% - 40px));margin:10vh auto 22px;text-align:center;color:var(--muted)}.welcome .mark{width:52px;height:52px;margin:0 auto 15px;border-radius:15px;font-size:20px}.welcome h1{margin:0;color:var(--text);font-size:clamp(24px,3vw,34px);letter-spacing:-.03em}.welcome p{max-width:700px;margin:10px auto 16px}.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.chips span{padding:3px 9px;border:1px solid var(--border);border-radius:999px;background:#14171d;font-size:11px}.hidden{display:none!important}
.messages{width:min(920px,calc(100% - 36px));margin:auto;padding:25px 0 80px}.msg{display:flex;gap:13px;padding:18px 5px}.avatar{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:9px;background:var(--accent);color:#111;font-size:12px;font-weight:800}.msg.user .avatar{background:#303846;color:var(--text)}.bubble{min-width:0;flex:1}.msg.user .bubble{padding:11px 14px;background:var(--user);border:1px solid #2e3542;border-radius:15px}.text{white-space:pre-wrap;overflow-wrap:anywhere}.content{overflow-wrap:anywhere}.content p:first-child{margin-top:0}.content p:last-child{margin-bottom:0}.content h1,.content h2,.content h3{line-height:1.3;margin:1.1em 0 .55em}.content a{color:#b9d6ff}.content table{display:block;max-width:100%;overflow:auto;border-collapse:collapse}.content th,.content td{border:1px solid #333946;padding:6px 9px;white-space:nowrap}.content blockquote{margin:1em 0;padding:.2em 1em;border-left:3px solid #515a69;color:#b5bdc9;background:#151920}.content :not(pre)>code{background:#1c2028;border:1px solid #303744;border-radius:6px;padding:.12em .35em;font-family:ui-monospace,Consolas,monospace;font-size:.9em}.code{margin:1em 0;border:1px solid #303744;border-radius:12px;overflow:hidden;background:#0c0e12}.code-head{display:flex;justify-content:space-between;padding:7px 10px;background:#161a21;border-bottom:1px solid #303744;color:#9199a7;font-size:10px}.copy{border:0;background:transparent;color:#a0a8b5;padding:2px 6px}.code pre{margin:0;padding:13px;overflow:auto}.code code{font:12px/1.55 ui-monospace,Consolas,monospace}.content img{max-width:100%;border-radius:10px}.status{margin-top:8px;color:var(--muted);font-size:12px}.status-line{display:flex;align-items:center;gap:8px}.spin{width:13px;height:13px;border:2px solid #3c4350;border-top-color:#e5e8ed;border-radius:50%;animation:r .8s linear infinite}.done .spin{display:none}.hist{display:grid;gap:3px;margin:4px 0 0 21px;color:#71798a}.hist div{white-space:pre-wrap}@keyframes r{to{transform:rotate(360deg)}}
.composer-wrap{flex:none;padding:9px 18px 18px;background:linear-gradient(to bottom,transparent,var(--bg) 24%)}.composer{width:min(920px,100%);margin:auto;border:1px solid #353d49;background:#171a21;border-radius:17px;padding:11px 12px 8px;box-shadow:var(--shadow)}textarea{width:100%;min-height:28px;max-height:220px;display:block;resize:none;border:0;outline:0;background:transparent;color:var(--text);line-height:1.5;padding:3px 2px}textarea::placeholder{color:#687181}.tools{display:flex;justify-content:space-between;align-items:center;margin-top:7px}.hint,.foot{color:var(--muted2);font-size:10px}.send{padding:8px 15px;background:var(--accent);color:var(--accentText);border-color:transparent;font-weight:700}.send.stop{background:#3a2528;color:#f0c7c8}.foot{width:min(920px,100%);margin:7px auto 0;text-align:center}
.modal{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.6)}.modal.hidden{display:none}.card{width:min(520px,100%);padding:19px;border:1px solid var(--border);border-radius:18px;background:#171a21;box-shadow:var(--shadow)}.mhead{display:flex;justify-content:space-between;gap:12px}.mhead h2{margin:0}.mhead p{margin:3px 0 0;color:var(--muted);font-size:11px}.field{display:grid;gap:6px;margin-top:13px}.field span{font-size:11px;color:#a6aeba}.field input{width:100%;padding:9px 10px;border:1px solid #363e4a;border-radius:10px;background:#101319;color:var(--text);outline:0}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.actions .secondary{width:auto}
@media(max-width:800px){.sidebar{position:fixed;inset:0 auto 0 0;z-index:10;transform:translateX(-101%);transition:transform .2s ease;box-shadow:18px 0 40px rgba(0,0,0,.3)}.sidebar.open{transform:translateX(0)}.mobile{display:grid}.top{padding:0 12px;gap:9px}.info{flex:1}.messages{width:calc(100% - 22px)}.composer-wrap{padding-left:9px;padding-right:9px}}@media(max-width:520px){.hint{display:none}.msg{gap:9px;padding:14px 2px}.avatar{width:28px;height:28px}.msg.user .bubble{padding:10px 12px}.welcome{margin-top:7vh}.welcome p{font-size:13px}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="mark">S</div><div><strong>StudyAgent</strong><small>Local Agent UI</small></div></div>
  <button class="new" id="newChat">＋ 新建对话</button>
  <div class="side-title">对话</div>
  <div class="list" id="list"></div>
  <div class="side-bottom"><button class="secondary" id="settings">⚙ 设置</button><div class="backend"><div class="dot" id="dot"></div><div><strong id="health">连接检查中</strong><small id="healthDetail">/health</small></div></div></div>
</aside>
<section class="main">
<header class="top"><button class="icon mobile" id="toggle">☰</button><div class="info"><strong>StudyAgent</strong><span>DeepSeek Web · Browser Model</span></div><button class="icon" id="clear" title="清空当前对话">⌫</button></header>
<main class="chat" id="chat"><div class="welcome" id="welcome"><div class="mark">S</div><h1>StudyAgent</h1><p>完整的 StudyAgent 会分析、搜索、推理和教学，并通过本地浏览器调用 DeepSeek Web。</p><div class="chips"><span>Markdown</span><span>代码高亮</span><span>LaTeX</span><span>搜索 / 工具状态</span><span>Knowledge Graph</span></div></div><section class="messages" id="messages"></section></main>
<footer class="composer-wrap"><form class="composer" id="form"><textarea id="input" maxlength="20000" rows="1" placeholder="输入你的问题…" autocomplete="off"></textarea><div class="tools"><span class="hint">Enter 发送 · Shift+Enter 换行</span><button class="send" id="send" type="submit">发送</button></div></form><div class="foot">本地 StudyAgent UI · 最终回答不会按 token 流式显示</div></footer>
</section></div>
<div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="card"><div class="mhead"><div><h2 id="settingsTitle">设置</h2><p>默认使用当前页面提供的 StudyAgent API。</p></div><button class="icon" id="close">×</button></div><label class="field"><span>API 地址</span><input id="base" placeholder="/v1"></label><label class="field"><span>API Key（可选）</span><input id="key" type="password" placeholder="STUDY_AGENT_WEB_API_KEY"></label><div class="actions"><button class="secondary" id="reset" type="button">恢复默认</button><button class="send" id="save" type="button">保存</button></div></div></div>
<script>
const DEF="/v1",KEY="studyagent.ui.v3";
const $=s=>document.querySelector(s);
const state={conversations:[],active:null,running:false,ctrl:null,base:localStorage.getItem("studyagent.apiBase")||DEF,key:localStorage.getItem("studyagent.apiKey")||""};
const messages=$("#messages"),welcome=$("#welcome"),input=$("#input"),send=$("#send"),chat=$("#chat"),list=$("#list");
if(window.marked)marked.setOptions({gfm:true,breaks:false});
function id(){return"c-"+Date.now()+"-"+Math.random().toString(36).slice(2,8)}
function active(){return state.conversations.find(c=>c.id===state.active)||null}
function base(){let x=(state.base||DEF).trim()||DEF;if(!/^https?:\/\//i.test(x)&&!x.startsWith("/"))x="/"+x;return x.replace(/\/$/,"")}
function url(p){return base()+p}
function headers(){const h={"Content-Type":"application/json"};if(state.key.trim())h.Authorization="Bearer "+state.key.trim();return h}
function persist(){localStorage.setItem(KEY,JSON.stringify({conversations:state.conversations,active:state.active}));localStorage.setItem("studyagent.apiBase",state.base);localStorage.setItem("studyagent.apiKey",state.key)}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(x&&Array.isArray(x.conversations))state.conversations=x.conversations;if(x&&state.conversations.some(c=>c.id===x.active))state.active=x.active}catch(_){state.conversations=[]}if(!state.conversations.length)newChat(false);if(!state.active)state.active=state.conversations[0].id}
function newChat(save=true){const c={id:id(),title:"新对话",createdAt:Date.now(),messages:[]};state.conversations.unshift(c);state.active=c.id;render();if(save)persist();input.focus();closeSide()}
function title(t){t=String(t||"").replace(/\s+/g," ").trim();return t.length>28?t.slice(0,28)+"…":t||"新对话"}
function removeChat(cid){const i=state.conversations.findIndex(c=>c.id===cid);if(i<0)return;state.conversations.splice(i,1);if(state.active===cid)state.active=state.conversations[0]?.id;if(!state.conversations.length)newChat(false);else{render();persist()}}
function clearChat(){const c=active();if(!c)return;c.messages=[];c.title="新对话";render();persist();input.focus()}
function selectChat(cid){if(state.running)return;if(!state.conversations.some(c=>c.id===cid))return;state.active=cid;render();persist();closeSide();input.focus()}
function renderList(){list.textContent="";for(const c of state.conversations){const row=document.createElement("div");row.className="conv"+(c.id===state.active?" active":"");const b=document.createElement("button");b.className="conv-open";b.type="button";b.textContent=c.title;b.title=c.title;b.onclick=()=>selectChat(c.id);const d=document.createElement("button");d.className="conv-del";d.type="button";d.textContent="×";d.title="删除";d.onclick=e=>{e.stopPropagation();removeChat(c.id)};row.append(b,d);list.append(row)}}
function render(){renderList();messages.textContent="";const c=active();welcome.classList.toggle("hidden",!!c?.messages.length);if(c)for(const m of c.messages)renderMessage(m)}
function renderMessage(m){const el=document.createElement("article");el.className="msg "+m.role;const av=document.createElement("div");av.className="avatar";av.textContent=m.role==="user"?"你":"S";const b=document.createElement("div");b.className="bubble";const body=document.createElement("div");body.className="content";if(m.role==="assistant"&&m.statuses?.length)b.append(renderStatus(m.statuses,!m.done));if(m.role==="user"){body.className+=" text";body.textContent=m.content||""}else body.innerHTML=markdown(m.content||"");b.append(body);el.append(av,b);messages.append(el);enhance(el)}
function markdown(x){
 const stash=[];
 const token=i=>"__STUDY_AGENT_MATH_"+i+"__";
 const keep=value=>{const i=stash.length;stash.push(value);return token(i)};
 const outsideCode=(source,fn)=>{
  const parts=String(source).split(/(```[\\s\\S]*?```|~~~[\\s\\S]*?~~~)/g);
  return parts.map((part,i)=>i%2?part:fn(part)).join("");
 };
 let source=String(x??"");
 source=outsideCode(source,part=>part
  .replace(/\\\\[[\\s\\S]*?\\\\]/g,keep)
  .replace(/\\$\\$[\\s\\S]*?\\$\\$/g,keep)
  .replace(/\\\\([\\s\\S]*?)\\\\\)/g,keep)
  .replace(/\\[([^\\[\\]\\n]*(?:\\\\[A-Za-z]+|[_^]\\{?)[^\\[\\]]*)\\](?!\\()/g,value=>{
   const inner=value.slice(1,-1);
   return keep((/\\\\begin\\{/.test(inner)||inner.includes("\\n"))?"$"+inner+"$":"\\("+inner+"\\)");
  })
 );
 const html=window.marked?marked.parse(source):escapeHtml(source).replace(/\\n/g,"<br>");
 return stash.reduce((result,value,i)=>result.replaceAll(token(i),value),window.DOMPurify?DOMPurify.sanitize(html,{USE_PROFILES:{html:true}}):html);
}
function escapeHtml(x){const d=document.createElement("div");d.textContent=String(x);return d.innerHTML}
function enhance(root){root.querySelectorAll("pre code").forEach(code=>{if(code.dataset.enhanced)return;code.dataset.enhanced="1";if(window.hljs)hljs.highlightElement(code);const pre=code.parentElement,wrap=document.createElement("div");wrap.className="code";const head=document.createElement("div");head.className="code-head";const label=document.createElement("span");const cls=[...code.classList].find(x=>x.startsWith("language-"));label.textContent=cls?cls.slice(9):"code";const copy=document.createElement("button");copy.className="copy";copy.type="button";copy.textContent="复制";copy.onclick=async()=>{try{await navigator.clipboard.writeText(code.innerText);copy.textContent="已复制";setTimeout(()=>copy.textContent="复制",900)}catch(_){copy.textContent="失败"}};head.append(label,copy);pre.replaceWith(wrap);wrap.append(head,pre)});if(window.MathJax?.typesetPromise)MathJax.typesetPromise([root]).catch(()=>{})}
function renderStatus(arr,isRunning){
 const box=document.createElement("div");
 box.className="status"+(isRunning?"":" done");
 if(!arr.length){
  if(isRunning){const line=document.createElement("div");line.className="status-line";const sp=document.createElement("span");sp.className="spin";const now=document.createElement("span");now.textContent="处理中…";line.append(sp,now);box.append(line)}
  return box;
 }
 if(arr.length>1){
  const h=document.createElement("div");h.className="hist";
  arr.slice(0,-1).forEach(s=>{const d=document.createElement("div");d.textContent=s;h.append(d)});
  box.append(h);
 }
 const line=document.createElement("div");line.className="status-line";
 const sp=document.createElement("span");sp.className="spin";sp.style.display=isRunning?"":"none";
 const now=document.createElement("span");now.textContent=arr[arr.length-1]||"处理中…";
 line.append(sp,now);box.append(line);
 return box;
}
function running(x){state.running=x;send.textContent=x?"取消等待":"发送";send.classList.toggle("stop",x);input.disabled=x}
async function health(){try{const r=await fetch(url("/health"),{headers:headers(),cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const d=await r.json();$("#dot").className="dot ok";$("#health").textContent="API 在线";$("#healthDetail").textContent=d.model||"StudyAgent"}catch(e){$("#dot").className="dot err";$("#health").textContent="API 离线";$("#healthDetail").textContent=String(e.message||e)}}
function sseParse(buffer,cb){const parts=buffer.split("\n\n");const rest=parts.pop()||"";for(const part of parts){const line=part.split("\n").find(x=>x.startsWith("data: "));if(line)cb(line.slice(6))}return rest}
function scroll(){requestAnimationFrame(()=>chat.scrollTo({top:chat.scrollHeight,behavior:"smooth"}))}
async function sendMessage(){const text=input.value.trim(),c=active();if(!text||!c||state.running)return;c.messages.push({role:"user",content:text});if(c.messages.filter(m=>m.role==="user").length===1)c.title=title(text);const a={role:"assistant",content:"",statuses:[],done:false};c.messages.push(a);input.value="";autoResize();persist();render();running(true);scroll();const ctrl=new AbortController();state.ctrl=ctrl;try{const payload={model:"deepseek-web",messages:c.messages.filter(m=>m.role!=="assistant"||m.done).map(m=>({role:m.role,content:m.content})),stream:true};const r=await fetch(url("/chat/completions"),{method:"POST",headers:headers(),body:JSON.stringify(payload),signal:ctrl.signal});if(!r.ok)throw Error("HTTP "+r.status+": "+(await r.text()).slice(0,500));if(!r.body)throw Error("浏览器不支持流式响应");const reader=r.body.getReader(),decoder=new TextDecoder();let buf="",finished=false;while(!finished){const q=await reader.read();buf+=decoder.decode(q.value||new Uint8Array(),{stream:!q.done});buf=sseParse(buf,data=>{if(data==="[DONE]"){finished=true;return}try{const o=JSON.parse(data),d=o.choices?.[0]?.delta||{};if(d.reasoning_content)a.statuses.push(d.reasoning_content.trim());if(d.content)a.content+=d.content}catch(_){}});if(!q.done){render();scroll()}}if(!a.content.trim())a.content="请求完成，但 StudyAgent 没有返回最终回答。"}catch(e){a.content=e.name==="AbortError"?"⏹ 已取消前端等待；后台 Agent 可能仍在继续执行。":"请求失败：\n\n"+String(e.message||e)}finally{a.done=true;state.ctrl=null;running(false);persist();render();scroll()}}
function autoResize(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,220)+"px"}
function settings(){ $("#base").value=state.base;$("#key").value=state.key;$("#modal").classList.remove("hidden");$("#base").focus()}
function closeSettings(){$("#modal").classList.add("hidden")}
function saveSettings(){state.base=base();state.key=$("#key").value.trim();persist();closeSettings();health()}
function resetSettings(){$("#base").value=DEF;$("#key").value=""}
function closeSide(){$("#sidebar").classList.remove("open")}

$("#newChat").onclick=()=>newChat();$("#clear").onclick=clearChat;$("#settings").onclick=settings;$("#close").onclick=closeSettings;$("#save").onclick=saveSettings;$("#reset").onclick=resetSettings;$("#toggle").onclick=()=>$("#sidebar").classList.add("open");$("#modal").onclick=e=>{if(e.target.id==="modal")closeSettings()};$("#form").onsubmit=e=>{e.preventDefault();if(state.running)state.ctrl?.abort();else sendMessage()};input.oninput=autoResize;input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();if(!state.running)sendMessage()}};window.onkeydown=e=>{if(e.key==="Escape"){closeSettings();closeSide()}};
load();render();autoResize();health();setInterval(health,30000);
</script>
</body>
</html>
